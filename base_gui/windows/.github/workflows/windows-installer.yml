name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release de GitHub a la que subir el instalador (vacío = solo artefacto)"
        required: false
        default: ""
  push:
    tags: ["v*-win*"]        # solo las prereleases de Windows; las releases v1.x.y llevan el DMG

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Versión
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Tests (sin interfaz)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Iconos .ico
        run: python scripts/make_ico.py

      - name: PyInstaller
        run: pyinstaller --noconfirm presupuestador.spec

      - name: Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\windows\presupuestador.iss
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Presupuestador_Pro_${{ steps.ver.outputs.version }}_Windows
          path: dist/Presupuestador_Pro_*_Setup.exe

      - name: Subir a la release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release upload "$TAG" dist/Presupuestador_Pro_*_Setup.exe --clobber

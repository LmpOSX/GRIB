name: Tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: unittest (Linux, offscreen)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Bibliotecas de Qt para el modo offscreen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py"

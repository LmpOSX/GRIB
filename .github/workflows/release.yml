# Instaladores de Visor GRIB para Linux y Windows (y, a pedido, macOS arm64).
# Se dispara al publicar una etiqueta vX.Y.Z y adjunta los archivos a la
# "release" de esa etiqueta en GitHub.
#
# El DMG de macOS (Apple Silicon) se construye en forma local con
# scripts/build.sh y se sube con `gh release upload vX.Y.Z dist/*.dmg`; el
# job de macOS de este workflow sólo corre si se lanza a mano desde
# "Actions" con la casilla «macos» marcada (por ejemplo, sin un Mac a mano).
# No hay build para macOS Intel.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Construir también el DMG de macOS arm64 (normalmente se hace local)"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux_x86_64
            script: bash scripts/build_linux.sh
          - os: windows-latest
            name: Windows_x64
            script: pwsh scripts/build_windows.ps1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Bibliotecas de Qt, dpkg y FUSE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
              libdbus-1-3 libfontconfig1 libxcb-cursor0 libfuse2 dpkg-dev
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Construir instalador
        env:
          CI: "1"
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          path: |
            dist/Visor_GRIB_*
          if-no-files-found: error

  macos:
    name: macOS_arm64 (a pedido)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Construir instalador
        env:
          CI: "1"
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-macOS_arm64
          path: |
            dist/Visor_GRIB_*
          if-no-files-found: error

  release:
    name: Publicar en la release
    # Con etiqueta: espera a build y, si corrió, a macos (si se saltó no bloquea)
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && needs.build.result == 'success'
          && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          pattern: instaladores-*
          merge-multiple: true
      - name: Listar
        run: ls -la instaladores
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Visor GRIB ${{ github.ref_name }}
          files: instaladores/*
          fail_on_unmatched_files: true
